<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="660" xmlns="http://www.w3.org/2000/svg">
    
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FFFFFF"/>
            <stop offset="100%" style="stop-color:#F4F6F8"/>
        </linearGradient>
        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4A90E2"/>
            <stop offset="100%" style="stop-color:#7B68EE"/>
        </linearGradient>
        <filter id="shadowSmall" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
        </filter>
    </defs>
    <rect width="900" height="100%" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="900" height="130" fill="url(#headerGrad)"/>
    <text x="450" y="65" text-anchor="middle" 
          font-family="Arial, Helvetica, sans-serif" font-size="36" 
          font-weight="bold" fill="#FFFFFF">
        oglindă plană
    </text>
    
    
    
    <circle cx="450.0" cy="290" r="60" fill="#FFFFFF" opacity="0.15"/>
    <circle cx="450.0" cy="290" r="60" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <text x="450.0" y="310" text-anchor="middle" font-size="64" 
          font-family="Noto Color Emoji, Apple Color Emoji, Segoe UI Emoji, sans-serif">🪞</text>
    <text x="450.0" y="390" text-anchor="middle" 
          font-family="Arial" font-size="20" font-weight="bold" fill="#FFFFFF">
        O
    </text>
    <text x="450.0" y="412" text-anchor="middle" 
          font-family="Arial" font-size="13" fill="#2C3E50">
        Oglindă plană
    </text>
    <text x="450.0" y="430" text-anchor="middle" 
          font-family="Arial" font-size="11" fill="#7F8C8D" font-style="italic">
        O suprafață netedă și lucioasă
    </text>
    
    <rect x="50" y="500" width="800" height="50" rx="15" 
          fill="#E8F4FD" stroke="#4A90E2" stroke-width="2"/>
    <text x="450" y="532" text-anchor="middle" 
          font-family="Arial" font-size="14" fill="#1A1A2E">
        💡 O oglindă plană este o suprafață netedă și lucioasă care reflectă bine lumina. Este utilizată pentru a refleca imagini și obiecte.
    </text>
    <rect x="50" y="565" width="800" height="65" rx="12" 
          fill="#FFF9E6" stroke="#F4A261" stroke-width="2"/>
    <text x="450" y="589" text-anchor="middle" 
          font-family="Arial" font-size="13" font-weight="bold" fill="#E76F51">
        📖 Definiție
    </text>
    <text x="450" y="611" text-anchor="middle" 
          font-family="Arial" font-size="13" fill="#2C3E50">
        Suprafața plană, netedă și lucioasă care reflectă bine lumina se numește oglindă plană.
    </text>
</svg>