<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="820" xmlns="http://www.w3.org/2000/svg">
    
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FFFFFF"/>
            <stop offset="100%" style="stop-color:#F4F6F8"/>
        </linearGradient>
        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4A90E2"/>
            <stop offset="100%" style="stop-color:#7B68EE"/>
        </linearGradient>
        <filter id="shadowSmall" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.15"/>
        </filter>
    </defs>
    <rect width="900" height="100%" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="900" height="130" fill="url(#headerGrad)"/>
    <text x="450" y="65" text-anchor="middle" 
          font-family="Arial, Helvetica, sans-serif" font-size="36" 
          font-weight="bold" fill="#FFFFFF">
        imagine virtuală
    </text>
    
    
    
    <defs>
        <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="#F4A261"/>
        </marker>
        <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="#4A90E2"/>
        </marker>
    </defs>
    
    <!-- Mediu 1 (sus - aer) -->
    <rect x="100" y="200" width="700" height="200" 
          fill="#E8F4FD" opacity="0.4"/>
    <text x="770" y="230" font-family="Arial" font-size="14" fill="#4A90E2" font-weight="bold">
        Mediu 1 (aer)
    </text>
    
    <!-- Mediu 2 (jos - apă) -->
    <rect x="100" y="400" width="700" height="200" 
          fill="#4A90E2" opacity="0.3"/>
    <text x="770" y="590" font-family="Arial" font-size="14" fill="#4A90E2" font-weight="bold">
        Mediu 2 (apă)
    </text>
    
    <!-- Suprafața de separare -->
    <line x1="100" y1="400" x2="800" y2="400" 
          stroke="#2C3E50" stroke-width="3"/>
    
    <!-- Normala -->
    <line x1="450" y1="180" x2="450" y2="620" 
          stroke="#7B68EE" stroke-width="3" stroke-dasharray="8,6"/>
    <text x="462" y="190" font-family="Arial" font-size="14" font-weight="bold" fill="#7B68EE">
        C
    </text>
    <text x="462" y="210" font-family="Arial" font-size="11" fill="#7B68EE">
        normală
    </text>
    
    <!-- Punct O -->
    <circle cx="450" cy="400" r="6" fill="#2C3E50"/>
    <text x="428" y="425" font-family="Arial" font-size="16" font-weight="bold" fill="#2C3E50">
        O
    </text>
    
    <!-- Raza incidentă (din stânga sus) -->
    <line x1="250" y1="220" x2="450" y2="400" 
          stroke="#F4A261" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <text x="230" y="210" font-family="Arial" font-size="16" font-weight="bold" fill="#F4A261">
        A
    </text>
    <text x="170" y="300" font-family="Arial" font-size="12" fill="#F4A261">
        rază incidentă
    </text>
    
    <!-- Unghiul α (incidență) -->
    <path d="M 450 320 A 80 80 0 0 0 385 345" 
          fill="none" stroke="#27AE60" stroke-width="2"/>
    <text x="395" y="330" font-family="Arial" font-size="20" font-weight="bold" fill="#27AE60">
        α
    </text>
    
    <!-- Raza refractată (în jos, cu unghi diferit - mai aproape de normală) -->
    <line x1="450" y1="400" x2="580" y2="580" 
          stroke="#4A90E2" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text x="590" y="595" font-family="Arial" font-size="16" font-weight="bold" fill="#4A90E2">
        B
    </text>
    <text x="540" y="530" font-family="Arial" font-size="12" fill="#4A90E2">
        rază refractată
    </text>
    
    <!-- Unghiul γ (refracție) -->
    <path d="M 450 460 A 60 60 0 0 1 490 440" 
          fill="none" stroke="#27AE60" stroke-width="2"/>
    <text x="495" y="455" font-family="Arial" font-size="20" font-weight="bold" fill="#27AE60">
        γ
    </text>

    
    <rect x="50" y="640" width="800" height="50" rx="15" 
          fill="#E8F4FD" stroke="#4A90E2" stroke-width="2"/>
    <text x="450" y="672" text-anchor="middle" 
          font-family="Arial" font-size="14" fill="#1A1A2E">
        💡 Imaginea virtuală este reprezentată de un punct unde prelungirea razei luminii întâmpină o suprafață reflectorizată, chiar dacă ac
    </text>
    <rect x="50" y="705" width="800" height="85" rx="12" 
          fill="#FFF9E6" stroke="#F4A261" stroke-width="2"/>
    <text x="450" y="729" text-anchor="middle" 
          font-family="Arial" font-size="13" font-weight="bold" fill="#E76F51">
        📖 Definiție
    </text>
    <text x="450" y="751" text-anchor="middle" 
          font-family="Arial" font-size="13" fill="#2C3E50">
        Imaginea obținută la intersecția prelungirilor raze- S lor reflectate se numește imagine
    </text>
    <text x="450" y="769" text-anchor="middle" 
          font-family="Arial" font-size="13" fill="#2C3E50">
        virtuală.
    </text>
</svg>