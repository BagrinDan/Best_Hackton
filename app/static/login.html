<!doctype html>
<html lang="ro">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   PhysiCards AI — Login
  </title>
  <style>
   :root {
    --bg:#f7f8ff;
    --ink:#16213d;
    --muted:#74809d;
    --p:#6c55f5;
    --line:#e6e9f5
}
* {
    box-sizing:border-box
}
body {
    margin:0;
    font-family:Inter,system-ui,Segoe UI,sans-serif;
    background:var(--bg);
    color:var(--ink)
}
a {
    color:inherit;
    text-decoration:none
}
.nav {
    height:72px;
    background:#fff;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%
}
.brand {
    font-weight:900;
    font-size:22px;
    color:var(--p)
}
.actions {
    display:flex;
    gap:10px
}
.btn {
    border:1px solid var(--line);
    background:#fff;
    border-radius:13px;
    padding:11px 17px;
    font-weight:900;
    cursor:pointer
}
.primary {
    background:var(--p);
    border-color:var(--p);
    color:#fff
}
main {
    max-width:1100px;
    margin:auto;
    padding:48px 24px
}
.hero {
    border-radius:30px;
    padding:52px;
    background:linear-gradient(125deg,#171e4c,#5c42d4 65%,#8b75ff);
    color:#fff;
    display:grid;
    grid-template-columns:1.2fr .8fr;
    align-items:center
}
.hero h1 {
    font-size:52px;
    line-height:1.02;
    margin:0 0 18px
}
.hero p {
    font-size:18px;
    line-height:1.65;
    color:#ebe9ff;
    max-width:650px
}
.art {
    font-size:130px;
    text-align:center
}
.cta {
    display:flex;
    gap:12px;
    margin-top:25px
}
.cta .btn {
    padding:14px 20px
}
.section {
    padding:55px 0 10px
}
.section h2 {
    font-size:32px;
    text-align:center;
    margin:0 0 10px
}
.sub {
    text-align:center;
    color:var(--muted);
    margin-bottom:28px
}
.steps {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px
}
.card {
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    padding:24px
}
.card .ico {
    font-size:42px
}
.card p {
    color:var(--muted);
    line-height:1.55
}
.faq {
    max-width:800px;
    margin:0 auto
}
details {
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:17px 20px;
    margin:10px 0
}
summary {
    font-weight:900;
    cursor:pointer
}
details p {
    color:var(--muted);
    line-height:1.6
}
.auth {
    max-width:470px;
    margin:25px auto;
    background:#fff;
    border:1px solid var(--line);
    border-radius:28px;
    padding:34px;
    box-shadow:0 20px 50px #38366f12
}
.auth h1 {
    text-align:center;
    margin:5px 0 8px
}
.auth>p {
    text-align:center;
    color:var(--muted)
}
.field {
    margin:16px 0
}
.field label {
    display:block;
    font-size:13px;
    font-weight:900;
    margin-bottom:7px
}
.field input {
    width:100%;
    padding:14px;
    border:1px solid var(--line);
    border-radius:13px;
    outline:none
}
.field input:focus {
    border-color:#9c8cff;
    box-shadow:0 0 0 3px #eeeaff
}
.wide {
    width:100%;
    padding:14px;
    border:0;
    border-radius:13px;
    background:var(--p);
    color:#fff;
    font-weight:900;
    cursor:pointer
}
.switch {
    text-align:center;
    color:var(--muted);
    margin-top:18px
}
.switch a {
    color:var(--p);
    font-weight:900
}
.back {
    display:inline-block;
    margin-bottom:15px;
    color:var(--p);
    font-weight:900
}
@media(max-width:750px) {
    .hero {
        grid-template-columns:1fr;
        padding:34px
    }
    .hero h1 {
        font-size:39px
    }
    .art {
        display:none
    }
    .steps {
        grid-template-columns:1fr
    }
}
  </style>
 </head>
 <body>
  <nav class="nav">
   <a class="brand" href="welcome.html">
    ⚛ PhysiCards
    <span style="color:#74809d">
     AI
    </span>
   </a>
   <div class="actions">
    <a class="btn primary" href="register.html">
     Înregistrare
    </a>
   </div>
  </nav>
  <main>
   <a class="back" href="welcome.html">
    ← Înapoi la Welcome
   </a>
   <div class="auth">
    <div style="text-align:center;font-size:58px">
     👋
    </div>
    <h1>
     Bine ai revenit!
    </h1>
    <p>
     Autentifică-te pentru a continua învățarea.
    </p>
    <div class="field">
     <label>
      Email
     </label>
     <input id="email" placeholder="exemplu@email.com" type="email"/>
    </div>
    <div class="field">
     <label>
      Parolă
     </label>
     <input id="pass" placeholder="••••••••" type="password"/>
    </div>
    <button class="wide" onclick="login()">
     Intră în cont
    </button>
    <div class="switch">
     Nu ai cont?
     <a href="register.html">
      Creează cont
     </a>
    </div>
   </div>
  </main>
  <script>
   function login() {
    let e=email.value.trim(),p=pass.value;
    if(!e||!p) {
        alert('Introdu emailul și parola.');
        return
    }
    let saved=JSON.parse(localStorage.getItem('physiAccount')||'null');
    let name=(saved&&saved.email===e?saved.name:e.split('@')[0])||'Utilizator';
    localStorage.setItem('physiUser',JSON.stringify({name,email:e}));
    location.href='app.html'
}
  </script>
 </body>
</html>
